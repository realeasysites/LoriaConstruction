<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Get a ballpark price for your concrete patio in about a minute.">
  <link rel="stylesheet" href="/instant-estimate/ie.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eeece8; color: #1f2328; }

    .ie-page h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); margin: 0 0 6px; text-align: center; }
    .ie-page > p { text-align: center; color: #5f6368; margin: 0 0 26px; }
  </style>
</head>
<body>
  <!-- Standalone page. On a real site, paste the <div> + <script> into your own page instead. -->
