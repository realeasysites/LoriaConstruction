<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Leads · Loria Construction Admin</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <link rel="stylesheet" href="/sa/admin/panel.css">
</head>
<body>
  <header class="topbar">
    <div class="tb-brand"><img src="/img/logo-badge-sm.png" alt="" width="44"> <span>Loria Construction</span> <em>Leads</em></div>
    <div class="tb-actions">
      <a href="/" target="_blank" rel="noopener">View site</a>
      <a href="https://app.cretequote.com" target="_blank" rel="noopener">CreteQuote</a>
      <a href="/api/admin/leads.csv">Export CSV</a>
      <button id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="dash">
    <section id="site-analytics" aria-label="Website traffic"></section>

    <section class="stats" id="stats" aria-label="Lead counts"></section>

    <div class="dash-grid">
      <section class="panel leads-panel" aria-labelledby="leadsTitle">
        <div class="panel-head">
          <h2 id="leadsTitle">Contact-form messages</h2>
          <div class="filters">
            <input id="search" type="search" placeholder="Search name, phone, town…" aria-label="Search leads">
            <select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
          </div>
        </div>
        <div id="leadList" class="lead-list"><p class="empty">Loading…</p></div>
      </section>

      <aside class="panel ie-panel" aria-labelledby="ieTitle">
        <h2 id="ieTitle">Instant Estimates</h2>
        <p class="hint">Online estimates come through <b>CreteQuote</b>. Leads and quotes from the website's estimate form are in your CreteQuote account, not here.</p>
        <div class="ie-links">
          <a class="primary" href="https://app.cretequote.com" target="_blank" rel="noopener">Open CreteQuote</a>
        </div>
      </aside>
    </div>
  </main>

  <script src="/admin/assets/admin.js"></script>
  <script src="/sa/admin/panel.js"></script>
</body>
</html>
